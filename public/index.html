<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Parser</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="panel">
        <div class="panel-header">
          <span class="badge">HTML Parser</span>
          <h1>Article Parser</h1>
        </div>

        <form id="parser-form" class="form">
          <label for="url-input" class="label">URL сайта</label>
          <div class="input-row">
            <input
              id="url-input"
              name="url"
              type="url"
              placeholder="https://example.com"
              autocomplete="off"
              required
            />
            <button type="submit" id="submit-button">Парсить</button>
          </div>
        </form>

        <div id="status" class="status" aria-live="polite"></div>

        <div id="result" class="result hidden">
          <h2 id="article-title">Статья</h2>
          <div id="article-body" class="article-body"></div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
